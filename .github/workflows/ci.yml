name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: if (gofmt -l . | grep -q .); then echo "Run gofmt on changed files"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server
