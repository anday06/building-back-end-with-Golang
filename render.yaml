services:
  - type: web
    name: task-management-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: task-management-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_HOURS
        value: 24

  - type: redis
    name: task-management-cache
    plan: free
    ipAllowList: []

databases:
  - name: task-management-db
    plan: free
    databaseName: tasks
    user: postgres
